version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gorm_postgres
    environment:
      POSTGRES_USER: arvinder.pal
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gorm_gin_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped

  app:
    build: .
    container_name: gorm_app
    ports:
      - "8083:8080"
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: arvinder.pal
      DB_PASSWORD: password
      DB_NAME: gorm_gin_db
      DB_SSLMODE: disable
      SERVER_PORT: 8080
    networks:
      - app_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge